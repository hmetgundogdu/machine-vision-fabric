# Universal Node Contract for the Rust runtime (issue #10). The .NET engine keeps using module.json.
apiVersion: mvf.dev/v1alpha1
kind: NodeContract
metadata:
  id: py.invert-transformer
  version: 1.0.0
  description: Inverts every byte of a frame (b -> 255 - b) in Python.
spec:
  ports:
    inputs:
      - { name: frame, channel: data, type: frame }
    outputs:
      - { name: frame, channel: data, type: frame }
  artifacts:
    - { backend: worker, runtime: python, entry: transformer.py, protocol: 1 }
  isolation:
    minimum: process
  lifecycle:
    replacement: stateless
