[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mvf-sdk"
version = "0.1.0"
description = "MachineVisionFabric Python module SDK — author edge-vision pipeline modules (control plane over stdio, data plane over shared memory)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "MachineVisionFabric contributors" }]
keywords = ["machine-vision", "edge", "pipeline", "industrial", "onnx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# The SDK core has no hard runtime dependency; numpy is only needed for
# Payload.numpy() zero-copy tensor views, so it is an optional extra.
[project.optional-dependencies]
numpy = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/hmetgundogdu/machine-vision-fabric"
Repository = "https://github.com/hmetgundogdu/machine-vision-fabric"

[tool.hatch.build.targets.wheel]
packages = ["mvf_sdk"]

[tool.hatch.build.targets.sdist]
include = ["mvf_sdk", "README.md"]
