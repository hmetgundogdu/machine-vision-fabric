name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The engine tests spawn real Python modules (readiness, warm-pool, pipelined executor).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy
      - run: dotnet build Mvf.slnx -c Release --nologo
      - run: dotnet test Mvf.slnx -c Release --no-build --nologo

  python-sdk:
    name: Python SDK wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build src/sdk/python

  egress-client-ts:
    name: Egress client (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Codec/framing tests run via Node's built-in test runner + type stripping — no install needed.
      - run: npm test
        working-directory: clients/mvf-egress-client

  # Research workspace for the Pure Rust core (issue #10). Isolated under rust/; it never touches the
  # .NET jobs above, and a failure here says nothing about the shipping .NET engine.
  rust:
    name: Rust runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # Worker-backend tests spawn real Python modules through the existing MVF Python SDK.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  cpp-sdk:
    name: C++ SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S src/sdk/cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cpp --config Release
