name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The engine tests spawn real Python modules (readiness, warm-pool, pipelined executor).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy
      - run: dotnet build Mvf.slnx -c Release --nologo
      - run: dotnet test Mvf.slnx -c Release --no-build --nologo

  python-sdk:
    name: Python SDK wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build src/sdk/python

  egress-client-ts:
    name: Egress client (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Codec/framing tests run via Node's built-in test runner + type stripping — no install needed.
      - run: npm test
        working-directory: clients/mvf-egress-client

  # Research workspace for the Pure Rust core (issue #10). Isolated under rust/; it never touches the
  # .NET jobs above, and a failure here says nothing about the shipping .NET engine.
  rust:
    name: Rust runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # Worker-backend tests spawn real Python modules through the existing MVF Python SDK.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Real C++ and .NET SDK workers for the interop and protocol tests (no mock: the tests fail if
      # they are missing). .NET is a test fixture here, not a runtime dependency of the engine.
      - name: Build C++ SDK examples
        run: |
          cmake -S ../src/sdk/cpp -B target/cpp-sdk -DCMAKE_BUILD_TYPE=Release
          cmake --build target/cpp-sdk --config Release
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build .NET worker SDK examples
        run: |
          dotnet publish ../src/sdk/dotnet/examples/InvertTransformer -c Release -o target/dotnet-sdk/InvertTransformer --nologo
          dotnet publish ../src/sdk/dotnet/examples/MeanAnalyzer -c Release -o target/dotnet-sdk/MeanAnalyzer --nologo
      - run: cargo test --workspace --locked
        env:
          MVF_REQUIRE_CPP: "1"
          MVF_REQUIRE_DOTNET: "1"
          # Display Fabric (#30): open real windows where the runner has a desktop session; a
          # runner without one reports BLOCKED from the session probe instead of failing.
          MVF_DISPLAY_SMOKE: "1"
      # Worker protocol v1 vs v2 through the engine with every SDK (#32). Informational: it prints a
      # table, and fails only if a node does not run or does not speak the protocol it was offered.
      - name: Worker protocol benchmark (v1 vs v2)
        run: cargo test --release --locked -p mvf-ipc --test engine_bench -- --nocapture
        env:
          MVF_IPC_BENCH: "1"

  cpp-sdk:
    name: C++ SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S src/sdk/cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cpp --config Release
