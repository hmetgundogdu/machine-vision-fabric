name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dotnet-sdk-nuget:
    name: .NET worker SDK → NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # C# nodes run under `mvf` as workers built with this SDK (#32). The in-process SDK of the
          # legacy runtime (Mvf.Sdk, Mvf.Graph, Mvf.Abstractions) is archived; its last packages are 1.1.0.
          dotnet pack src/sdk/dotnet/Mvf.Worker/Mvf.Worker.csproj -c Release -p:Version="$VERSION" -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: dist/*.*nupkg

  python-sdk-wheel:
    name: Python SDK → wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build wheel (version from tag)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src/sdk/python/pyproject.toml
          python -m build src/sdk/python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*

  cpp-sdk:
    name: C++ SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: linux-x64 }
          - { os: macos-latest,   label: osx-arm64 }
          - { os: windows-latest, label: win-x64 }
    steps:
      - uses: actions/checkout@v4
      - name: Configure (version from tag)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          cmake -S src/sdk/cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release "-DMVF_SDK_VERSION=$v"
      - name: Build
        run: cmake --build build/cpp --config Release
      - name: Stage (headers + shared library)
        run: cmake --install build/cpp --config Release --prefix stage
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "mvf-sdk-cpp-${{ github.ref_name }}-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-${{ matrix.label }}
          path: mvf-sdk-cpp-${{ github.ref_name }}-${{ matrix.label }}.zip

  # The CLI (#10, #34): `mvf` (validate, run, import, manage), the mvf-remote relay and signer, and
  # mvf-display-host. No .NET or Docker needed to run them.
  cli:
    name: CLI (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: linux-x64 }
          - { os: macos-latest,   label: osx-arm64 }
          - { os: windows-latest, label: win-x64 }
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: The tag must match the workspace version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME, but rust/Cargo.toml says $have"; exit 1; }
      - name: Build (release)
        run: cargo build --release --locked -p mvf-cli -p mvf-remote -p mvf-display-host
        env:
          # Shipped binaries without debug info (the repository profile keeps it for profiling).
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
      - name: Package
        shell: pwsh
        run: |
          $ext = if ($IsWindows) { ".exe" } else { "" }
          $stage = "stage/mvf-${{ github.ref_name }}-${{ matrix.label }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($b in "mvf", "mvf-remote", "mvf-display-host") { Copy-Item "target/release/$b$ext" $stage }
          Copy-Item ../LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "../mvf-${{ github.ref_name }}-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.label }}
          path: mvf-${{ github.ref_name }}-${{ matrix.label }}.zip

  release:
    name: Publish GitHub Release
    needs: [dotnet-sdk-nuget, python-sdk-wheel, cpp-sdk, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
