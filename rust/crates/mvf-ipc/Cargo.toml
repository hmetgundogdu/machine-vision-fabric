[package]
name = "mvf-ipc"
description = "MVF worker protocol v2 (#32): length-prefixed binary frames for the runtime-to-node control channel, both sides (engine and Rust children), plus the fixture child and benchmarks against stdio v1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mvf-ipc-echo"
path = "src/bin/mvf-ipc-echo.rs"

[dependencies]
serde_json = "1.0.154"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
libc = "0.2.191"
mvf-engine = { path = "../mvf-engine" }
mvf-graph = { path = "../mvf-graph" }
mvf-worker = { path = "../mvf-worker" }
