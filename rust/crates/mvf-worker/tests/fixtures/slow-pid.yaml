apiVersion: mvf.dev/v1alpha1
kind: NodeContract
metadata: { id: test.slow-pid, version: 1.0.0 }
spec:
  ports:
    inputs: [ { name: frame, channel: data, type: frame } ]
    outputs: [ { name: class, channel: data, type: classification } ]
  artifacts: [ { backend: worker, runtime: python, entry: slow_pid.py, protocol: 1 } ]
  isolation: { minimum: process }
  execution: { maxParallelism: 4 }
  lifecycle: { readinessTimeoutMs: 10000, executeTimeoutMs: 10000, drainTimeoutMs: 2000, replacement: stateless }
