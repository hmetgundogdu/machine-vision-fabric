[package]
name = "mvf-worker"
description = "MVF supervised local stdio worker backend (protocol v1, compatible with the Python/C++ SDKs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mvf-contract = { path = "../mvf-contract" }
mvf-engine = { path = "../mvf-engine" }
mvf-graph = { path = "../mvf-graph" }
mvf-memory = { path = "../mvf-memory" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
