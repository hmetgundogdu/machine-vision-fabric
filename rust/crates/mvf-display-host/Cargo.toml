[package]
name = "mvf-display-host"
description = "MVF Display Fabric: the optional display host for the user's session (winit + softbuffer), a Rust 3D cube renderer node, and a native-window proof of concept. Nodes and the engine never link this crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mvf-display-host"
path = "src/main.rs"

[dependencies]
mvf-display = { path = "../mvf-display" }
mvf-memory = { path = "../mvf-memory" }
memmap2 = "0.9.12"
serde_json = "1.0.154"
# The window libraries are the host's (and the native PoC's) choice; node applications need none.
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[dev-dependencies]
mvf-contract = { path = "../mvf-contract" }
mvf-engine = { path = "../mvf-engine" }
mvf-graph = { path = "../mvf-graph" }
mvf-worker = { path = "../mvf-worker" }

[lints]
workspace = true
