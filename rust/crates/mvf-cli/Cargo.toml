[package]
name = "mvf-cli"
description = "mvf-rs: native CLI for the MVF Rust runtime (no CLR, no Docker daemon)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mvf-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
ctrlc = "3.5.3"
mvf-contract = { path = "../mvf-contract" }
mvf-engine = { path = "../mvf-engine" }
mvf-graph = { path = "../mvf-graph" }
mvf-management = { path = "../mvf-management" }
mvf-compute = { path = "../mvf-compute" }
mvf-container = { path = "../mvf-container" }
mvf-oci = { path = "../mvf-oci" }
mvf-storage = { path = "../mvf-storage" }
mvf-worker = { path = "../mvf-worker" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
