[package]
name = "mvf-storage"
description = "MVF Storage Fabric: provisioning of persistent, shared, host-bind and digest-pinned artifact volumes and scratch space; path safety; retention and accounting. The OS does the file I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mvf-contract = { path = "../mvf-contract" }
mvf-oci = { path = "../mvf-oci" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
libc = "0.2.191"
